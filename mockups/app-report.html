<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report Redesign</title>
<style>
.phone {
  --bg: #f2f2f7; --cell: #ffffff; --label: #000; --sec: rgb(60 60 67 / .6); --ter: rgb(60 60 67 / .3); --sep: rgb(60 60 67 / .14);
  --fill: rgb(120 120 128 / .12);
  --red: #ff3b30; --orange: #ff9500; --green: #34c759; --blue: #007aff; --pink: #ff2d55;
  --glass: rgb(255 255 255 / .6); --glass-edge: rgb(0 0 0 / .06);
  --shadow: 0 1px 2px rgb(0 0 0 / .04), 0 8px 24px -12px rgb(0 0 0 / .12);
}
.phone.dark {
  --bg: #000; --cell: #1c1c1e; --label: #fff; --sec: rgb(235 235 245 / .6); --ter: rgb(235 235 245 / .3); --sep: rgb(84 84 88 / .45);
  --fill: rgb(120 120 128 / .24);
  --red: #ff453a; --orange: #ff9f0a; --green: #30d158; --blue: #0a84ff; --pink: #ff375f;
  --glass: rgb(44 44 46 / .55); --glass-edge: rgb(255 255 255 / .1);
  --shadow: none;
}
:root { --page: #e8e8ed; --page-ink: #1d1d1f; --page-sec: #6e6e73; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #0b0b0c; --page-ink: #f5f5f7; --page-sec: #8e8e93; } }
:root[data-theme="dark"] { --page: #0b0b0c; --page-ink: #f5f5f7; --page-sec: #8e8e93; }

* { box-sizing: border-box; margin: 0; }
body { background: var(--page); color: var(--page-ink); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; padding: 40px 16px 64px; -webkit-font-smoothing: antialiased; }
h1 { text-align: center; font: 700 28px/1.1 -apple-system, "SF Pro Display", sans-serif; letter-spacing: -.02em; margin-bottom: 36px; }
.stage { display: flex; gap: 40px; flex-wrap: wrap; justify-content: center; }
.shot { display: flex; flex-direction: column; align-items: center; gap: 18px; }
.cap { font-size: 13px; color: var(--page-sec); }
.round { font-family: ui-rounded, "SF Pro Rounded", -apple-system, "SF Pro Display", sans-serif; }

/* Device */
.phone { width: 402px; height: 874px; border-radius: 62px; position: relative; overflow: hidden; background: var(--bg); color: var(--label); flex: none;
  box-shadow: 0 0 0 10px #1a1a1c, 0 0 0 11.5px #48484c, 0 40px 80px -30px rgb(0 0 0 / .5); font-size: 17px; letter-spacing: -.41px; }
@media (max-width: 460px) { .phone { transform: scale(.86); transform-origin: top center; margin-bottom: -122px; } }
.island { position: absolute; top: 11px; left: 50%; translate: -50% 0; width: 124px; height: 36px; border-radius: 20px; background: #000; z-index: 40; }
.status { position: absolute; inset: 0 0 auto; height: 54px; display: flex; justify-content: space-between; align-items: center; padding: 4px 36px 0 52px; font-weight: 600; z-index: 35; color: #fff; transition: color .2s; }
.phone.scrolled .status { color: var(--label); }
.status .i { display: flex; gap: 6px; align-items: center; }
.homebar { position: absolute; bottom: 8px; left: 50%; translate: -50% 0; width: 140px; height: 5px; border-radius: 3px; background: var(--label); z-index: 40; }

/* Nav */
.nav { position: absolute; inset: 0 0 auto; padding: 56px 16px 0; height: 108px; display: flex; justify-content: space-between; align-items: center; z-index: 30; }
.nav::before { content: ""; position: absolute; inset: 0; background: linear-gradient(var(--bg) 60%, transparent); opacity: 0; transition: opacity .2s; }
.phone.scrolled .nav::before { opacity: 1; }
.nav .t { position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; font-weight: 600; opacity: 0; transition: opacity .2s; }
.phone.scrolled .nav .t { opacity: 1; }
.glass { background: var(--glass); backdrop-filter: blur(20px) saturate(1.8); -webkit-backdrop-filter: blur(20px) saturate(1.8); box-shadow: inset 0 0 0 .5px var(--glass-edge), 0 6px 20px -8px rgb(0 0 0 / .2); }
.gb { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; position: relative; color: #fff; background: rgb(255 255 255 / .22); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: inset 0 0 0 .5px rgb(255 255 255 / .35); transition: all .2s; }
.phone.scrolled .gb { color: var(--label); background: var(--glass); box-shadow: inset 0 0 0 .5px var(--glass-edge), 0 6px 20px -8px rgb(0 0 0 / .2); }
.gb svg { width: 19px; height: 19px; }

.scroll { position: absolute; inset: 0; overflow-y: auto; scrollbar-width: none; padding-bottom: 130px; }
.scroll::-webkit-scrollbar { display: none; }

/* Hero */
.hero { position: relative; padding: 108px 20px 92px; color: #fff; display: flex; flex-direction: column; align-items: center; text-align: center; overflow: hidden; isolation: isolate; }
.hero::before { content: ""; position: absolute; inset: -40px; z-index: -2;
  background:
    radial-gradient(60% 50% at 15% 10%, #ff6b3d 0%, transparent 70%),
    radial-gradient(55% 45% at 90% 20%, #ff2d55 0%, transparent 70%),
    radial-gradient(70% 60% at 50% 75%, #ff9f0a 0%, transparent 70%),
    #ff453a; filter: saturate(1.1); }
.phone.dark .hero::before { background:
    radial-gradient(60% 50% at 15% 10%, #c2361b 0%, transparent 70%),
    radial-gradient(55% 45% at 90% 20%, #b0153f 0%, transparent 70%),
    radial-gradient(70% 60% at 50% 75%, #b86a00 0%, transparent 70%),
    #8c1f17; }
.hero::before { inset: 0 -40px; -webkit-mask-image: linear-gradient(#000 calc(100% - 110px), transparent); mask-image: linear-gradient(#000 calc(100% - 110px), transparent); }
.prod { width: 56px; height: 56px; border-radius: 15px; display: grid; place-items: center; background: rgb(255 255 255 / .22); box-shadow: inset 0 0 0 .5px rgb(255 255 255 / .4); backdrop-filter: blur(10px); }
.prod svg { width: 28px; height: 28px; }
.hero .brand { margin-top: 12px; font-size: 15px; font-weight: 600; opacity: .8; letter-spacing: -.2px; }
.hero h2 { font: 700 34px/1.1 -apple-system, "SF Pro Display", sans-serif; letter-spacing: .3px; }

.ringwrap { position: relative; width: 196px; height: 196px; margin: 22px 0 6px; }
.ringwrap svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.ringwrap .mid { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ringwrap .n { font-size: 72px; font-weight: 700; line-height: .95; letter-spacing: -2px; }
.ringwrap .l { font-size: 15px; font-weight: 600; opacity: .85; }
.keys { display: flex; gap: 8px; margin-top: 10px; }
.key { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 99px; background: rgb(255 255 255 / .2); box-shadow: inset 0 0 0 .5px rgb(255 255 255 / .35); }
.key i { width: 8px; height: 8px; border-radius: 50%; }

.body { padding: 0 16px; display: flex; flex-direction: column; }
.sh { font: 700 22px/1.2 -apple-system, "SF Pro Display", sans-serif; letter-spacing: .35px; margin: 28px 4px 12px; display: flex; justify-content: space-between; align-items: baseline; }
.sh small { font: 400 15px -apple-system, sans-serif; color: var(--blue); letter-spacing: -.24px; }
.card { background: var(--cell); border-radius: 26px; box-shadow: var(--shadow); }

/* Boarding pass origin */
.pass { position: relative; padding: 20px 22px 0; overflow: hidden; }
.pass .route { display: grid; grid-template-columns: auto 1fr auto; align-items: end; gap: 12px; }
.pass .cap2 { font-size: 12px; font-weight: 600; color: var(--sec); letter-spacing: .3px; text-transform: uppercase; }
.pass .code { font-size: 46px; font-weight: 700; letter-spacing: -.5px; line-height: 1; margin-top: 6px; }
.pass .code.no { color: var(--ter); position: relative; }
.pass .code.no::after { content: ""; position: absolute; left: -3px; right: -3px; top: 52%; height: 4px; border-radius: 2px; background: var(--red); transform: rotate(-8deg); }
.pass .city { font-size: 15px; color: var(--sec); margin-top: 4px; }
.pass .end { text-align: right; }
.pass .mid { display: flex; align-items: center; padding-bottom: 32px; color: var(--ter); }
.pass .mid .dash { flex: 1; height: 0; border-top: 2px dashed var(--fill); }
.pass .mid svg { width: 20px; height: 20px; color: var(--red); margin: 0 4px; }
.pass .perf { position: relative; margin: 18px -22px 0; height: 0; border-top: 2px dashed var(--sep); }
.pass .perf::before, .pass .perf::after { content: ""; position: absolute; top: -12px; width: 22px; height: 22px; border-radius: 50%; background: var(--bg); }
.pass .perf::before { left: -11px; } .pass .perf::after { right: -11px; }
.pass .stub { display: flex; justify-content: space-between; align-items: center; padding: 14px 0 16px; font-size: 15px; }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; padding: 5px 10px; border-radius: 99px; }
.tag svg { width: 12px; height: 12px; }
.t-red { color: var(--red); background: color-mix(in srgb, var(--red) 13%, transparent); }
.t-orange { color: var(--orange); background: color-mix(in srgb, var(--orange) 15%, transparent); }

/* Widget grid */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.widget { padding: 16px; display: flex; flex-direction: column; gap: 10px; min-height: 150px; position: relative; overflow: hidden; }
.widget .ic { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #fff; }
.widget .ic svg { width: 17px; height: 17px; }
.widget .q { font-size: 19px; font-weight: 700; line-height: 1.15; letter-spacing: -.3px; flex: 1; }
.widget .v { font-size: 15px; font-weight: 600; }
.widget.red { background: linear-gradient(160deg, color-mix(in srgb, var(--red) 12%, var(--cell)), var(--cell) 70%); }
.widget.orange { background: linear-gradient(160deg, color-mix(in srgb, var(--orange) 14%, var(--cell)), var(--cell) 70%); }

/* Rule banner */
.banner { display: flex; align-items: center; gap: 14px; padding: 14px 16px; }
.banner .ic { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; color: #fff; background: linear-gradient(160deg, #ff6b5f, var(--red)); flex: none; }
.banner .ic svg { width: 22px; height: 22px; }
.banner b { display: block; font-size: 17px; }
.banner span { font-size: 15px; color: var(--sec); }

/* Gauges */
.gauge { padding: 18px 16px 16px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
.gauge .g { position: relative; width: 104px; height: 104px; }
.gauge .g svg { transform: rotate(-90deg); }
.gauge .g .pct { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--label); font-size: 26px; font-weight: 700; letter-spacing: -.5px; }
.gauge .g .pct small { font-size: 14px; font-weight: 600; }
.gauge b { font-size: 17px; display: block; }
.gauge span { font-size: 13px; color: var(--sec); }

/* Chain */
.chain { padding: 22px 18px 18px; display: flex; flex-direction: column; gap: 14px; }
.track { display: flex; align-items: center; }
.node { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--fill); color: var(--ter); }
.node svg { width: 19px; height: 19px; }
.node.on { color: #fff; background: linear-gradient(160deg, #4ea1ff, var(--blue)); box-shadow: 0 6px 16px -6px var(--blue); }
.link { flex: 1; height: 2px; background: var(--fill); }
.chain .foot { display: flex; justify-content: space-between; align-items: baseline; }
.chain .foot b { font-size: 17px; }
.chain .foot span { font-size: 15px; color: var(--sec); }
.chain .segs { display: flex; gap: 4px; }
.chain .segs i { width: 18px; height: 6px; border-radius: 3px; background: var(--fill); }
.chain .segs i.on { background: var(--blue); }

/* Tappable cards */
[data-d] { cursor: pointer; position: relative; transition: transform .18s cubic-bezier(.3,.7,.4,1); -webkit-tap-highlight-color: transparent; }
[data-d]:active { transform: scale(.97); }
.more { position: absolute; top: 14px; right: 14px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--fill); color: var(--sec); }
.more svg { width: 8px; height: 8px; }
.stub .more, .foot .more, .banner .more { position: static; flex: none; }
.banner .more { margin-left: auto; }
.foot > div:first-child { flex: 1; }
.stub, .foot { gap: 8px; }

/* Sheet */
.scrim { position: absolute; inset: 0; background: rgb(0 0 0 / .32); opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 50; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 78%; background: var(--sheet); border-radius: 38px 38px 0 0; z-index: 51;
  transform: translateY(102%); transition: transform .42s cubic-bezier(.32,.72,0,1); display: flex; flex-direction: column; box-shadow: 0 -10px 40px -10px rgb(0 0 0 / .25); }
.phone { --sheet: #f2f2f7; } .phone.dark { --sheet: #1c1c1e; }
.phone.dark .sheet .row-group { background: #2c2c2e; }
.phone.open .scrim { opacity: 1; pointer-events: auto; }
.phone.open .sheet { transform: none; }
.phone.open .dock { opacity: 0; }
.dock { transition: opacity .2s; }
.grab { width: 36px; height: 5px; border-radius: 3px; background: var(--ter); margin: 7px auto 0; flex: none; }
.sheet .top { display: flex; align-items: center; gap: 12px; padding: 14px 20px 16px; }
.sheet .top .ic { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; color: #fff; flex: none; }
.sheet .top .ic svg { width: 22px; height: 22px; }
.sheet .top h3 { font: 700 22px/1.15 -apple-system, "SF Pro Display", sans-serif; letter-spacing: .3px; }
.sheet .top .x { margin-left: auto; width: 32px; height: 32px; border-radius: 50%; background: var(--fill); display: grid; place-items: center; color: var(--sec); flex: none; cursor: pointer; }
.sheet .top .x svg { width: 12px; height: 12px; }
.sheet .content { overflow-y: auto; scrollbar-width: none; padding: 0 16px 40px; display: flex; flex-direction: column; gap: 22px; }
.sheet .content::-webkit-scrollbar { display: none; }
.sheet .lead { font-size: 17px; line-height: 1.4; padding: 0 4px; }
.sheet .lbl { font-size: 13px; color: var(--sec); text-transform: uppercase; letter-spacing: -.08px; padding: 0 16px 6px; }
.row-group { background: var(--cell); border-radius: 14px; overflow: hidden; }
.r { display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-height: 48px; position: relative; font-size: 17px; }
.r + .r::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: .5px; background: var(--sep); }
.r .k { flex: 1; }
.r .k small { display: block; font-size: 13px; color: var(--sec); margin-top: 1px; }
.r .v { color: var(--sec); text-align: right; }
.r .dotk { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.para { font-size: 15px; line-height: 1.45; color: var(--sec); padding: 0 16px; }
.btnrow { display: flex; justify-content: center; }
.btn2 { font-size: 17px; font-weight: 600; color: var(--blue); padding: 12px 20px; border-radius: 14px; background: color-mix(in srgb, var(--blue) 12%, transparent); width: 100%; text-align: center; }

.source { text-align: center; color: var(--sec); font-size: 13px; margin-top: 26px; }

.dock { position: absolute; left: 0; right: 0; bottom: 30px; display: flex; justify-content: center; z-index: 30; }
.pillbtn { height: 54px; border-radius: 27px; padding: 0 28px; display: flex; align-items: center; gap: 8px; font-weight: 600; color: #fff; background: var(--label); box-shadow: 0 10px 30px -10px rgb(0 0 0 / .45); }
.phone.dark .pillbtn { color: #000; }
.pillbtn svg { width: 20px; height: 20px; }
</style>
</head>
<body>
<h1>Report</h1>
<div class="stage">
  <div class="shot"><div class="phone" id="p1"></div><div class="cap">Light</div></div>
  <div class="shot"><div class="phone" id="p2"></div><div class="cap">Tap a card</div></div>
  <div class="shot"><div class="phone dark" id="p3"></div><div class="cap">Dark</div></div>
</div>

<template id="tpl">
  <div class="island"></div>
  <div class="status"><span>9:41</span><span class="i">
    <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" width="3" height="12" rx="1"/></svg>
    <svg width="16" height="12" viewBox="0 0 17 12" fill="currentColor"><path d="M8.5 2.3c2.4 0 4.6.9 6.2 2.5l1.2-1.2C14 1.6 11.4.5 8.5.5S3 1.6 1.1 3.6l1.2 1.2C3.9 3.2 6.1 2.3 8.5 2.3zm0 3.5c1.4 0 2.7.5 3.7 1.4l1.2-1.2c-1.3-1.2-3-1.9-4.9-1.9s-3.6.7-4.9 1.9l1.2 1.2c1-.9 2.3-1.4 3.7-1.4zm0 3.4c.5 0 1 .2 1.3.5L8.5 11 7.2 9.7c.3-.3.8-.5 1.3-.5z"/></svg>
    <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.8" fill="none" stroke="currentColor" opacity=".35"/><rect x="2" y="2" width="20" height="9" rx="2.4" fill="currentColor"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill="currentColor" opacity=".4"/></svg>
  </span></div>

  <div class="nav">
    <span class="gb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4.5 7.5 12l7.5 7.5"/></svg></span>
    <span class="t">Leather Tote</span>
    <span class="gb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.8v12.4"/><path d="M7.8 7 12 2.8 16.2 7"/><path d="M8 10.5H6.5a1.5 1.5 0 0 0-1.5 1.5v8a1.5 1.5 0 0 0 1.5 1.5h11a1.5 1.5 0 0 0 1.5-1.5v-8a1.5 1.5 0 0 0-1.5-1.5H16"/></svg></span>
  </div>

  <div class="scroll">
    <div class="hero">
      <div class="prod"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 8.5h15l-1.2 11a1.5 1.5 0 0 1-1.5 1.3H7.2a1.5 1.5 0 0 1-1.5-1.3z"/><path d="M8.5 8.5V7a3.5 3.5 0 0 1 7 0v1.5"/></svg></div>
      <div class="brand">Demo Brand</div>
      <h2>Leather Tote</h2>
      <div class="ringwrap">
        <svg width="196" height="196" viewBox="0 0 196 196">
          <circle cx="98" cy="98" r="84" fill="none" stroke="rgb(255 255 255 / .22)" stroke-width="18"/>
          <circle cx="98" cy="98" r="84" fill="none" stroke="#fff" stroke-width="18" stroke-linecap="round" stroke-dasharray="243 285" stroke-dashoffset="-6"/>
          <circle cx="98" cy="98" r="84" fill="none" stroke="rgb(255 255 255 / .55)" stroke-width="18" stroke-linecap="round" stroke-dasharray="243 285" stroke-dashoffset="-270"/>
        </svg>
        <div class="mid"><span class="n round">2</span><span class="l">Issues</span></div>
      </div>
      <div class="keys">
        <span class="key"><i style="background:#fff"></i>1 False</span>
        <span class="key"><i style="background:rgb(255 255 255 / .55)"></i>1 Vague</span>
      </div>
    </div>

    <div class="body">
      <div class="sh" style="margin-top:6px">Origin</div>
      <div class="card pass" data-d="origin">
        <div class="route">
          <div><div class="cap2">Listing</div><div class="code no round">ITA</div><div class="city">Italy</div></div>
          <div class="mid"><span class="dash"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg></div>
          <div class="end"><div class="cap2">Care Label</div><div class="code round">CHN</div><div class="city">China</div></div>
        </div>
        <div class="perf"></div>
        <div class="stub"><span style="color:var(--sec);flex:1">Sewn in China</span><span class="tag t-red"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>Mismatch</span></div>
      </div>

      <div class="sh">Claims</div>
      <div class="grid2">
        <div class="card widget red" data-d="italy">
          <span class="ic" style="background:var(--red)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M7 7l10 10M17 7 7 17"/></svg></span>
          <div class="q">“Made in Italy”</div>
          <div class="v" style="color:var(--red)">False</div>
        </div>
        <div class="card widget orange" data-d="leather-claim">
          <span class="ic" style="background:var(--orange)"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="10.6" y="5" width="2.8" height="9.5" rx="1.4"/><circle cx="12" cy="18.6" r="1.6"/></svg></span>
          <div class="q">“Genuine leather”</div>
          <div class="v" style="color:var(--orange)">Vague</div>
        </div>
      </div>

      <div class="sh">For You</div>
      <div class="card banner" data-d="rule">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M6 18 18 6"/></svg></span>
        <div><b>Doesn't fit</b><span>Lining is polyester</span></div>
      </div>

      <div class="sh mats">Materials</div>
      <div class="grid2">
        <div class="card gauge" data-d="leather">
          <div class="g"><svg width="104" height="104" viewBox="0 0 104 104"><circle cx="52" cy="52" r="44" fill="none" stroke="var(--fill)" stroke-width="12"/><circle cx="52" cy="52" r="44" fill="none" stroke="var(--green)" stroke-width="12" stroke-linecap="round" stroke-dasharray="276.5 300"/></svg><span class="pct round">100<small>%</small></span></div>
          <div><b>Leather</b><span>Outer · Natural</span></div>
        </div>
        <div class="card gauge" data-d="polyester">
          <div class="g"><svg width="104" height="104" viewBox="0 0 104 104"><circle cx="52" cy="52" r="44" fill="none" stroke="var(--fill)" stroke-width="12"/><circle cx="52" cy="52" r="44" fill="none" stroke="var(--orange)" stroke-width="12" stroke-linecap="round" stroke-dasharray="276.5 300"/></svg><span class="pct round">100<small>%</small></span></div>
          <div><b>Polyester</b><span>Lining · Plastic</span></div>
        </div>
      </div>

      <div class="sh">Supply Chain</div>
      <div class="card chain" data-d="chain">
        <div class="track">
          <span class="node"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 19c0-8 5-13 14-14-1 9-6 14-14 14z"/></svg></span><span class="link"></span>
          <span class="node"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 10h16M4 15h16"/></svg></span><span class="link"></span>
          <span class="node"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg></span><span class="link"></span>
          <span class="node on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.5 7.5 20 17M8.5 16.5 20 7"/></svg></span><span class="link"></span>
          <span class="node"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg></span>
        </div>
        <div class="foot"><div><b class="round">1 of 5</b> <span>steps known</span></div></div>
      </div>

      <p class="source">Care label and listing · Nov 18</p>
    </div>
  </div>

  <div class="dock"><span class="pillbtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"/><path d="M8 9v6M11 9v6M14 9v6M17 9v6" stroke-width="1.8"/></svg>Scan Another</span></div>
  <div class="scrim"></div>
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="grab"></div>
    <div class="top"><span class="ic"></span><h3></h3><span class="x" role="button" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></span></div>
    <div class="content"></div>
  </div>
  <div class="homebar"></div>
</template>

<script>
const I = {
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M7 7l10 10M17 7 7 17"/></svg>',
  warn: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="10.6" y="5" width="2.8" height="9.5" rx="1.4"/><circle cx="12" cy="18.6" r="1.6"/></svg>',
  pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></svg>',
  no: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M6 18 18 6"/></svg>',
  leaf: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 19c0-8 5-13 14-14-1 9-6 14-14 14z"/></svg>',
  drop: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3c3 4 6 7.5 6 11a6 6 0 0 1-12 0c0-3.5 3-7 6-11z"/></svg>',
  chain: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.5 7.5 20 17M8.5 16.5 20 7"/></svg>',
};
const row = (k, v, sub, dot) => `<div class="r">${dot ? `<span class="dotk" style="background:${dot}"></span>` : ""}<span class="k">${k}${sub ? `<small>${sub}</small>` : ""}</span><span class="v">${v}</span></div>`;
const group = (label, rows) => `<div>${label ? `<div class="lbl">${label}</div>` : ""}<div class="row-group">${rows.join("")}</div></div>`;
const src = (s) => group("Source", [row(s, "")]);

const DETAILS = {
  origin: { icon: I.pin, color: "var(--red)", title: "Origin", html: `
    <p class="lead">The store says Italy. The label sewn into the bag says China.</p>
    ${group("Compared", [row("Listing", '<span style="color:var(--red)">Italy</span>', "Store product page"), row("Care label", '<b style="color:var(--label)">China</b>', "Sewn into the product")])}
    <p class="para">"Made in China" names where the product was last substantially changed, usually where it was cut and sewn. It says nothing about where the leather came from.</p>
    ${src("Care label")}` },
  italy: { icon: I.x, color: "var(--red)", title: "“Made in Italy”", html: `
    <p class="lead">This claim is <b style="color:var(--red)">false</b>. The care label says China.</p>
    ${group("Details", [row("Verdict", '<span style="color:var(--red)">Contradicted</span>'), row("Claimed in", "Listing")])}
    ${src("Care label")}` },
  "leather-claim": { icon: I.warn, color: "var(--orange)", title: "“Genuine leather”", html: `
    <p class="lead">Real leather, but <b style="color:var(--orange)">not a grade</b>. It's often used for lower-quality split leather.</p>
    ${group("Leather grades", [row("Full-grain", "Best", null, "var(--green)"), row("Top-grain", "Good", null, "var(--green)"), row("Genuine", "Lower", null, "var(--orange)")])}
    ${src("FTC Guides for Select Leather and Imitation Leather Products (16 CFR Part 24)")}` },
  rule: { icon: I.no, color: "var(--red)", title: "No polyester", html: `
    <p class="lead">This bag <b style="color:var(--red)">doesn't fit</b> your rule. The lining is 100% polyester.</p>
    ${group("Checked", [row("Outer", "Leather", null, "var(--green)"), row("Lining", "Polyester", null, "var(--orange)")])}
    <p class="para">Your rules are stored and checked only on this phone.</p>
    <div class="btnrow"><span class="btn2">Edit Rules</span></div>` },
  leather: { icon: I.leaf, color: "var(--green)", title: "Leather", html: `
    <p class="lead">Animal hide. Grade matters: full-grain is best; "genuine leather" is real but often lower-grade split leather.</p>
    ${group("Details", [row("Part", "Outer"), row("Share", "100%"), row("Type", "Natural · Animal")])}
    ${src("Care label")}` },
  polyester: { icon: I.drop, color: "var(--orange)", title: "Polyester", html: `
    <p class="lead">Plastic fiber. Durable, quick-drying and cheap, but less breathable.</p>
    ${group("Details", [row("Part", "Lining"), row("Share", "100%"), row("Type", "Plastic-based")])}
    <p class="para">Sheds microplastics in the wash.</p>
    ${src("Care label")}` },
  chain: { icon: I.chain, color: "var(--blue)", title: "Supply Chain", html: `
    <p class="lead">Only <b>1 of 5</b> steps is disclosed.</p>
    ${group(null, [row("Raw material", "Unknown"), row("Fabric or main material", "Unknown"), row("Components", "Unknown", "Zippers, buttons, soles"), row("Cutting & sewing", '<b style="color:var(--blue)">China</b>', "From the care label"), row("Finishing", "Unknown")])}
    <p class="para">Labels only have to name the last country that substantially changed the product.</p>` },
};

const MORE = '<span class="more" aria-hidden="true"><svg viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 1.5 6.5 7l-5 5.5"/></svg></span>';

function open(phone, key) {
  const d = DETAILS[key];
  const sh = phone.querySelector(".sheet");
  const ic = sh.querySelector(".ic");
  ic.innerHTML = d.icon; ic.style.background = d.color;
  sh.querySelector("h3").textContent = d.title;
  sh.querySelector(".content").innerHTML = d.html;
  sh.querySelector(".content").scrollTop = 0;
  phone.classList.add("open");
}
const close = (phone) => phone.classList.remove("open");

const tpl = document.getElementById("tpl");
for (const id of ["p1", "p2", "p3"]) {
  const phone = document.getElementById(id);
  phone.appendChild(tpl.content.cloneNode(true));
  const s = phone.querySelector(".scroll");
  s.addEventListener("scroll", () => phone.classList.toggle("scrolled", s.scrollTop > 330), { passive: true });
  for (const card of phone.querySelectorAll("[data-d]")) {
    (card.querySelector(".stub, .foot") || card).insertAdjacentHTML("beforeend", MORE);
    card.setAttribute("role", "button");
    card.addEventListener("click", () => open(phone, card.dataset.d));
  }
  phone.querySelector(".scrim").addEventListener("click", () => close(phone));
  phone.querySelector(".sheet .x").addEventListener("click", () => close(phone));
}
// Middle phone shows a sheet already open.
open(document.getElementById("p2"), "leather-claim");
</script>
</body>
</html>
